openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Source-attributed consumer product catalog
  - name: liv-ai
    description: Source-grounded Liv assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/products:
    get:
      operationId: searchCatalogProducts
      tags: [catalog]
      summary: Search saved and approved live product catalogs
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [All, Skincare, Beauty, Wellness, Household]
            default: All
        - name: live
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
      responses:
        "200":
          description: Matching products, provider states, and coverage information
          content:
            application/json:
              schema:
                type: object
                required: [products, providers, coverageNotice]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/LivProduct"
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogProviderStatus"
                  coverageNotice:
                    type: string
        "400":
          description: Search query is too short for a live provider search
        "429":
          description: Live catalog provider rate limit reached
  /catalog/products/{id}:
    get:
      operationId: getCatalogProduct
      tags: [catalog]
      summary: Get a sourced product by canonical barcode identifier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product with provenance and evidence status
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product:
                    $ref: "#/components/schemas/LivProduct"
        "404":
          description: No product matches the identifier
  /liv/ask:
    post:
      operationId: askLiv
      tags: [liv-ai]
      summary: Ask Liv using catalog evidence and optional web research
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 1200
                productId:
                  type: string
                  maxLength: 40
                history:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 1200
                preferences:
                  type: array
                  maxItems: 12
                  items:
                    type: string
                    maxLength: 80
      responses:
        "200":
          description: Research answer, citations, and routing metadata
          content:
            application/json:
              schema:
                type: object
                required: [answer, citations, model, usedWebSearch, catalogCacheHit]
                properties:
                  answer:
                    type: string
                  citations:
                    type: array
                    items:
                      type: object
                      required: [title, url]
                      properties:
                        title: { type: string }
                        url: { type: string, format: uri }
                  model: { type: string }
                  usedWebSearch: { type: boolean }
                  catalogCacheHit: { type: boolean }
        "400":
          description: Invalid question
        "429":
          description: Too many requests
        "502":
          description: Research provider unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LivProduct:
      type: object
      properties:
        id:
          type: string
          description: Canonical barcode identifier for this exact product record
        brand:
          type: string
        name:
          type: string
        category:
          type: string
        quantity:
          type: [string, "null"]
        ingredientsText:
          type: [string, "null"]
        sourceStatus:
          type: string
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
        ingredientEvidence:
          type: array
          items:
            type: object
            additionalProperties: true
        scores:
          type: array
          items:
            type: object
            additionalProperties: true
        communityRating:
          type: [number, "null"]
        communityReviewCount:
          type: [integer, "null"]
        communityRatingSource:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - brand
        - name
        - category
        - sourceStatus
        - sources
        - ingredientEvidence
        - scores
    CatalogProviderStatus:
      type: object
      properties:
        id:
          type: string
          enum: [open_beauty_facts, open_products_facts]
        label:
          type: string
        status:
          type: string
          enum: [searched, rate_limited, unavailable, not_applicable]
        returned:
          type: integer
      required: [id, label, status, returned]

